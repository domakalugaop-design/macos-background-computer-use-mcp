name: CI
on:
  push:
  pull_request:
jobs:
  adapter:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: swift build --product computer-use-mcp -c release
      - run: mkdir -p bin && cp .build/release/computer-use-mcp bin/computer-use-mcp
      - run: npm ci
      - run: npm test

  swift-arm64:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift build --product computer-use-mcp -c release
